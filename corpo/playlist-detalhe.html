<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist | Prod.Kaiky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #0a0a0a; color: white;">


<!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">BEATS</a></li>
                <li><a href="playlists.html" class="nav-link">PLAYLISTS</a></li>
                <li><a href="#" class="nav-link">SOBRE</a></li>
            </ul>
        </div>
    </nav>

<main class="playlist-detail-page">
    <!-- Banner Principal da Playlist -->
    <section class="playlist-banner">
        <div class="banner-content">
            <img id="playlist-cover" src="capa-vazia.jpg" alt="Capa" class="main-cover">
            <div class="banner-text">
                <span class="label-neon">PLAYLIST</span>
                <h1 id="playlist-title">Carregando...</h1>
                <p id="playlist-author">PROD.KAIKY • <span id="track-count">0</span> Beats</p>
                <button class="btn-tocar-top" onclick="tocarPrimeira()"><i class="fas fa-play"></i> TOCAR TUDO</button>
            </div>
        </div>
    </section>

    <!-- Grid de Beats -->
    <section class="beats-grid-container">
        <div id="lista-tracks-dinamica" class="playlist-tracks-grid">
            <!-- O JS vai injetar os cards aqui -->
        </div>
    </section>
</main>

<footer class="street-footer">
        <p>&copy; 2026 Prod.Kaiky. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
    <script>
        // Lógica para carregar os dados assim que a página abre
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const genero = urlParams.get('genero');
            
            console.log("Gênero detectado na URL:", genero); // Para debug no F12

            if (genero && typeof carregarPlaylistDinamica === "function") {
                carregarPlaylistDinamica(genero);
            } else {
                console.error("Erro: Função carregarPlaylistDinamica não encontrada ou gênero ausente.");
            }
        });
    </script>
</body>
</html>
