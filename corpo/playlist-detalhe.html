<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist | Prod.Kaiky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #0a0a0a; color: white;">

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">BEATS</a></li>
                <li><a href="playlists.html" class="nav-link">PLAYLISTS</a></li>
                <li><a href="#" class="nav-link">SOBRE</a></li>
            </ul>
        </div>
    </nav>

    <main class="playlist-detail-page">
        <section class="playlist-banner">
            <div class="banner-content">
                <img id="playlist-cover" src="" alt="Capa" class="main-cover">
                <div class="banner-text">
                    <span class="label-neon">PLAYLIST</span>
                    <h1 id="playlist-title">Carregando...</h1>
                    <p id="playlist-author">PROD.KAIKY • <span id="track-count">0</span> Beats</p>
                    <button class="btn-tocar-top" onclick="tocarPrimeira()"><i class="fas fa-play"></i> TOCAR TUDO</button>
                </div>
            </div>
        </section>

        <section class="beats-grid-container">
            <div id="lista-tracks-dinamica" class="playlist-tracks-grid">
                </div>
        </section>
    </main>

    <footer class="street-footer">
        <p>&copy; 2026 Prod.Kaiky. Todos os direitos reservados.</p>
    </footer>

<script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
    <script>
        // Inicializa o sistema de playlists
        inicializarPlaylists();

        // Lógica corrigida para evitar que a página abra vazia
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            let genero = urlParams.get('genero');
            
            // Se o gênero não vier na URL (primeira imagem), definimos 'trap' como padrão
            if (!genero) {
                genero = 'trap'; 
                console.log("Nenhum gênero na URL. Carregando gênero padrão: trap");
            } else {
                console.log("Gênero detectado na URL:", genero);
            }

            // Agora a função sempre recebe um gênero válido e nunca fica travada!
            if (typeof carregarPlaylistDinamica === "function") {
                carregarPlaylistDinamica(genero);
            } else {
                console.error("Erro: Função carregarPlaylistDinamica não encontrada no script.js.");
            }

            // Atualiza os contadores a cada 1 segundo para sincronização
            setInterval(() => {
                atualizarTodosContadores();
            }, 1000);
        });
    </script>
</body>
</html>
