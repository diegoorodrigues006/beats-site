<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Beats | Prod.Kaiky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #0a0a0a; color: white;">
<div id="global-loader">
  <div class="loading-wave">
    <div class="loading-bar"></div>
    <div class="loading-bar"></div>
    <div class="loading-bar"></div>
    <div class="loading-bar"></div>
  </div>
</div>

    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">INÍCIO</a></li>
                <li><a href="musicas.html" class="nav-link">BEATS</a></li>
                <li><a href="playlists.html" class="nav-link">PLAYLISTS</a></li>
            </ul>
        </div>
    </nav>

    <main class="playlist-detail-page">
        <section class="playlist-banner" style="background: linear-gradient(to bottom, #1a1a1a, #0a0a0a); justify-content: center; text-align: center; padding-top: 80px;">
            <div class="banner-text">
                <h1 style="font-size: 4rem; color: white; margin-bottom: 10px;">TODOS OS BEATS</h1>
                <p style="color: #ccff00; font-weight: bold; letter-spacing: 2px;">CATÁLOGO COMPLETO</p>
            </div>
        </section>

        <section class="beats-grid-container" style="padding: 40px 10%;">
            <!-- MUSIC PLAYER -->
            <div style="grid-column: 1 / -1; display: flex; justify-content: center; margin-bottom: 30px;">
                <div class="player-container" style="width: 100%; max-width: 600px;">
                    <div class="player-album-art" id="player-album-art">
                        <div class="player-placeholder">
                            <i class="fas fa-music"></i>
                        </div>
                    </div>
                    <div class="player-info">
                        <h3 class="player-title" id="player-title">Selecione um Beat</h3>
                        <p class="player-artist">PROD. KAIKY</p>
                    </div>
                    <div class="player-controls-new">
                        <button class="control-btn" onclick="musicaAnterior()" title="Anterior">
                            <i class="fas fa-step-backward"></i>
                        </button>
                        <label class="play-toggle" id="play-toggle-label">
                            <input type="checkbox" id="play-toggle" onchange="togglePlay()">
                            <span class="play-icon"><i class="fas fa-play"></i></span>
                            <span class="pause-icon"><i class="fas fa-pause"></i></span>
                        </label>
                        <button class="control-btn" onclick="proximaMusica()" title="Próxima">
                            <i class="fas fa-step-forward"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filter-section" style="grid-column: 1 / -1; margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button class="filter-btn active" onclick="filtrarBeats('todos')">Todos</button>
                <button class="filter-btn" onclick="filtrarBeats('trap')">Trap</button>
                <button class="filter-btn" onclick="filtrarBeats('boombap')">Boombap</button>
                <button class="filter-btn" onclick="filtrarBeats('detroit')">Detroit</button>
                <button class="filter-btn" onclick="filtrarBeats('funk')">Funk</button>
                <button class="filter-btn" onclick="filtrarBeats('experimental')">Experimental</button>
            </div>
            
            <div id="lista-todos-beats" class="playlist-tracks-grid" style="grid-column: 1 / -1;">
                </div>
        </section>
    </main>

    <div id="player-api" style="display: none;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
    
    <script>
        // Inicializa a renderização de beats quando a página carrega
        window.addEventListener('load', function() {
            renderizarTodosBeats('todos');
        });
    </script>
</body>
</html>
